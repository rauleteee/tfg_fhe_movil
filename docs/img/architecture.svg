<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="Helvetica,Arial,sans-serif">
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker>
<style>
.box{fill:#fff;stroke:#334155;stroke-width:2}
.t{font-size:14px;font-weight:700;fill:#0f172a;text-anchor:middle}
.s{font-size:11px;fill:#475569;text-anchor:middle}
.l{font-size:11px;fill:#1e293b;text-anchor:middle}
.ln{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}
.fl{stroke-width:3;fill:none;stroke-dasharray:6 10;animation:d 1s linear infinite}
@keyframes d{to{stroke-dashoffset:-16}}
</style></defs>
<rect width="1040" height="520" fill="#f8fafc"/>
<rect x="240" y="20" width="560" height="480" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="6 4" stroke-width="2"/>
<text x="520" y="42" class="s" font-weight="700">Remote virtual server · Ubuntu 20.04 (IONOS) · independent microservices</text>
<!-- clients -->
<rect class="box" x="20" y="60" width="180" height="100" rx="10"/><text x="110" y="90" class="t">Employee phone</text><text x="110" y="110" class="s">UsersFlow (Xamarin.Forms, iOS)</text><text x="110" y="126" class="s">FHE encrypt/decrypt · Argon2</text><text x="110" y="142" class="s">Secure Storage (Keychain)</text>
<rect class="box" x="20" y="340" width="180" height="100" rx="10"/><text x="110" y="370" class="t">HR Manager phone</text><text x="110" y="390" class="s">UsersFlow (Xamarin.Forms, iOS)</text><text x="110" y="406" class="s">holds every employee's key</text><text x="110" y="422" class="s">Secure Storage (Keychain)</text>
<!-- modules -->
<rect class="box" x="270" y="70" width="210" height="90" rx="10"/><text x="375" y="98" class="t">REST API</text><text x="375" y="118" class="s">.NET Web API · HTTP :5025</text><text x="375" y="134" class="s">MVC + Repository · CRUD</text><text x="375" y="150" class="s">only component touching MySQL</text>
<rect class="box" x="580" y="70" width="200" height="90" rx="10"/><text x="680" y="105" class="t">MySQL (UsersInfo)</text><text x="680" y="125" class="s">Users · user_time</text><text x="680" y="142" class="s">FHE ciphertexts only</text>
<rect class="box" x="580" y="215" width="200" height="90" rx="10" style="stroke:#7c3aed"/><text x="680" y="245" class="t">Homomorphic server</text><text x="680" y="265" class="s">SEAL Evaluator</text><text x="680" y="281" class="s">hours worked = leave − entry</text><text x="680" y="297" class="s">never sees plaintext</text>
<rect class="box" x="270" y="360" width="210" height="90" rx="10"/><text x="375" y="388" class="t">Key exchange server</text><text x="375" y="408" class="s">TCP + SSL/TLS 1.2 · :10001</text><text x="375" y="424" class="s">X.509 mutual auth · 1 thread/client</text><text x="375" y="440" class="s">sends FCM notifications</text>
<rect class="box" x="840" y="360" width="180" height="90" rx="10" style="stroke:#f59e0b"/><text x="930" y="395" class="t">Firebase FCM</text><text x="930" y="415" class="s">Google · push by device token</text>
<!-- links -->
<path class="ln" d="M200,100 L270,105"/><path class="fl" stroke="#2563eb" d="M200,100 L270,105"/><text x="236" y="86" class="l">HTTP</text>
<path class="ln" d="M200,390 C240,390 235,135 270,135"/><path class="fl" stroke="#2563eb" d="M200,390 C240,390 235,135 270,135"/>
<path class="ln" d="M110,160 C110,260 190,380 270,395"/><path class="fl" stroke="#dc2626" d="M110,160 C110,260 190,380 270,395"/><text x="150" y="270" class="l">TLS</text>
<path class="ln" d="M200,420 L270,420"/><path class="fl" stroke="#dc2626" d="M200,420 L270,420"/><text x="236" y="438" class="l">TLS</text>
<path class="ln" d="M480,115 L580,115"/><path class="fl" stroke="#16a34a" d="M480,115 L580,115"/><text x="530" y="105" class="l">SQL</text>
<path class="ln" d="M480,150 L580,235"/><path class="fl" stroke="#7c3aed" d="M480,150 L580,235"/><text x="545" y="210" class="l">ciphertexts</text>
<path class="ln" d="M375,360 L375,160" stroke-dasharray="3 3"/><text x="440" y="270" class="l">GET token/{user}</text>
<path class="ln" d="M480,405 L840,405"/><path class="fl" stroke="#f59e0b" d="M480,405 L840,405"/><text x="660" y="395" class="l">push request</text>
<path class="ln" d="M930,450 C930,500 160,505 110,440" stroke-dasharray="3 3"/><text x="520" y="492" class="l">notification to phone</text>
<g font-size="11" fill="#334155"><rect x="20" y="18" width="9" height="9" fill="#2563eb"/><text x="35" y="27">encrypted data (HTTP)</text><rect x="20" y="34" width="9" height="9" fill="#dc2626"/><text x="35" y="43">key transfer (TLS 1.2)</text></g>
</svg>
