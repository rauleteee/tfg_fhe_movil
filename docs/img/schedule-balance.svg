<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#334155"/></marker>
<style>.b{fill:#fff;stroke:#334155;stroke-width:2}.t{font-size:13px;font-weight:700;text-anchor:middle;fill:#0f172a}.s{font-size:11px;text-anchor:middle;fill:#475569}
.p{animation:mv 8s linear infinite;opacity:0}
@keyframes mv{0%{opacity:0;transform:translateX(0)}4%{opacity:1}96%{opacity:1}100%{opacity:0;transform:translateX(var(--dx))}}
.ar{stroke:#334155;stroke-width:2;marker-end:url(#a);fill:none}</style></defs>
<rect width="1040" height="300" fill="#f8fafc"/>
<rect class="b" x="10" y="70" width="190" height="100" rx="8"/><text class="t" x="105" y="100">Employee phone</text><text class="s" x="105" y="120">date · entry · leave</text><text class="s" x="105" y="136">SEAL encrypt (BFV)</text><text class="s" x="105" y="152">key from Keychain</text>
<rect class="b" x="270" y="40" width="450" height="190" rx="10" style="stroke:#2563eb"/><text class="t" x="495" y="64">REST API (:5025)</text><text class="s" x="495" y="80">POST /api/user/schedule/addNewSchedule</text>
<rect class="b" x="300" y="100" width="190" height="100" rx="8" style="stroke:#7c3aed"/><text class="t" x="395" y="128">Homomorphic evaluator</text><text class="s" x="395" y="148">loads encParms + context</text><text class="s" x="395" y="164">balance = leave − entry</text><text class="s" x="395" y="180">SEAL Evaluator.Sub</text>
<rect class="b" x="520" y="100" width="170" height="100" rx="8"/><text class="t" x="605" y="128">Repository</text><text class="s" x="605" y="148">InsertDataEntry</text><text class="s" x="605" y="164">parameterized SQL</text>
<rect class="b" x="790" y="70" width="170" height="100" rx="8"/><text class="t" x="875" y="100">MySQL</text><text class="s" x="875" y="120">user_time</text><text class="s" x="875" y="136">entry · leave · balance</text><text class="s" x="875" y="152">(ciphertexts)</text>
<path class="ar" d="M200,120 L270,120"/><path class="ar" d="M490,150 L520,150"/><path class="ar" d="M690,130 L790,120"/>
<circle class="p" cx="200" cy="120" r="6" fill="#2563eb" style="--dx:60px"/>
<circle class="p" cx="490" cy="150" r="6" fill="#7c3aed" style="--dx:25px;animation-delay:2s"/>
<circle class="p" cx="690" cy="130" r="6" fill="#16a34a" style="--dx:95px;animation-delay:4s"/>
<text class="s" x="520" y="270">The server never sees plaintext: it only handles ciphertexts, Argon2 hashes and metadata</text>
</svg>
